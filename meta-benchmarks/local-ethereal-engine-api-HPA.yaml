apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: local-etherealengine-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: local-etherealengine-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 40

